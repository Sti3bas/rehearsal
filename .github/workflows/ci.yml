name: Rehearsal

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: composer install --working-dir=packages/php --no-interaction --prefer-dist
      - run: composer --working-dir=packages/php test
      - run: npm ci
      - run: npm run build && npm test

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, mysql, pgsql]
        workers: [1, 4]
    services:
      mysql:
        image: mirror.gcr.io/library/mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rehearsal_local
          MYSQL_ROOT_HOST: '%'
        ports:
          - 13386:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=15
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: rehearsal_local
        ports:
          - 15438:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: composer install --working-dir=examples/laravel --no-interaction --prefer-dist
      - run: php artisan rehearsal:install
        working-directory: examples/laravel
      - run: npm ci && npm run build
      - run: npx playwright install chromium --only-shell --with-deps
      - run: npm run e2e
        env:
          REHEARSAL_E2E_ENGINE: ${{ matrix.engine }}
          REHEARSAL_E2E_WORKERS: ${{ matrix.workers }}

  integrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scout: [database, meilisearch, typesense]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: composer install --working-dir=examples/laravel --no-interaction --prefer-dist
      - run: php artisan rehearsal:install
        working-directory: examples/laravel
      - run: npm ci && npm run build
      - run: npx playwright install chromium --only-shell --with-deps
      - name: Start disposable services
        env:
          SERVICE_HOST: ${{ matrix.scout == 'typesense' && '[::1]' || '127.0.0.1' }}
          REHEARSAL_TYPESENSE_CORS_ORIGINS: http://127.0.0.1:8100,http://127.0.0.1:8325
        run: |
          export REHEARSAL_UID="$(id -u)" REHEARSAL_GID="$(id -g)"
          REVERB_SCALING_ENABLED=true docker compose -f examples/laravel/compose.integrations.yml up --build --detach
          curl --globoff --retry 15 --retry-delay 1 --retry-all-errors --max-time 3 -fsS "http://$SERVICE_HOST:18025/api/v1/messages" >/dev/null
          curl --globoff --retry 15 --retry-delay 1 --retry-all-errors --max-time 3 -fsS "http://$SERVICE_HOST:18108/health" >/dev/null
          curl --retry 15 --retry-delay 1 --retry-all-errors --max-time 3 -fsS http://127.0.0.1:17700/health >/dev/null
          curl --retry 15 --retry-delay 1 --retry-all-errors --max-time 3 -sS http://127.0.0.1:18080 >/dev/null
      - run: npm run e2e -- services.spec.ts
        env:
          REHEARSAL_E2E_SCOUT: ${{ matrix.scout }}
          REHEARSAL_E2E_SERVICE_HOST: ${{ matrix.scout == 'typesense' && '[::1]' || '127.0.0.1' }}
          REHEARSAL_E2E_WORKERS: '4'
      - if: matrix.scout == 'typesense'
        run: npm run e2e -- nuxt-typesense.spec.ts
        env:
          REHEARSAL_E2E_SCOUT: typesense
          REHEARSAL_E2E_PORT: '8101'
          REHEARSAL_E2E_NUXT_PORT: '8325'
          REHEARSAL_E2E_WORKERS: '4'
      - if: matrix.scout == 'database'
        run: npm run e2e -- reverb.spec.ts
        env:
          REHEARSAL_E2E_REVERB: 'true'
          REHEARSAL_E2E_WORKERS: '4'
      - if: matrix.scout == 'database'
        name: Install FrankenPHP
        run: |
          curl -fsSLo "$RUNNER_TEMP/frankenphp" https://github.com/php/frankenphp/releases/download/v1.12.6/frankenphp-linux-x86_64
          echo "fa74f59593d32f43be9f2803de08cdeed06e9ae5d654a912a086b92b9b290394  $RUNNER_TEMP/frankenphp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/frankenphp"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - if: matrix.scout == 'database'
        run: npm run e2e -- ssr.spec.ts
        env:
          REHEARSAL_E2E_FRANKENPHP: 'true'
          REHEARSAL_E2E_PORT: '8101'
          REHEARSAL_E2E_NUXT_PORT: '8325'
          REHEARSAL_E2E_WORKERS: '4'
      - if: always()
        run: docker compose -f examples/laravel/compose.integrations.yml down
