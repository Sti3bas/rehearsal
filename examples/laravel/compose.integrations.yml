services:
  mailpit:
    image: mirror.gcr.io/axllent/mailpit:v1.27
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025", "[::1]:11025:1025", "[::1]:18025:8025"]
  typesense:
    image: mirror.gcr.io/typesense/typesense:29.0
    command: ["--data-dir=/tmp", "--api-key=rehearsal_test_only", "--enable-cors"]
    ports: ["127.0.0.1:18108:8108", "[::1]:18108:8108"]
  meilisearch:
    image: mirror.gcr.io/getmeili/meilisearch:v1.16
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: rehearsal_test_only
    ports: ["127.0.0.1:17700:7700"]
  reverb:
    build:
      context: .
      dockerfile: Dockerfile.reverb
    network_mode: host
    user: "${REHEARSAL_UID:-1000}:${REHEARSAL_GID:-1000}"
    volumes: ["../..:/workspace:ro"]
    working_dir: /workspace/examples/laravel
    environment:
      APP_ENV: playwright
      REHEARSAL_REVERB_SERVER: "true"
      REVERB_SCALING_ENABLED: "${REVERB_SCALING_ENABLED:-false}"
      LOG_CHANNEL: stderr
    command: ["php", "artisan", "reverb:start", "--host=127.0.0.1", "--port=18080"]
